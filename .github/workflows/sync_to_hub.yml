name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          git lfs install
          
          git lfs track "*.keras"
          git add .gitattributes
          
          git commit -m "Setup Git LFS for keras models" || true
          
          git push --force https://merkuribingung:$HF_TOKEN@huggingface.co/spaces/merkuribingung/AI-or-Human-Generated-Classification-Image main